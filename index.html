
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#4f46e5">
<title>가계부</title>
<style>
:root{
  --primary:#4f46e5;
  --bg:#f3f2fa;
  --card:#fff;
  --text:#202033;
  --sub:#77778b;
  --line:#e8e7f1;
  --soft:#eeedff;
  --red:#e54857;
  --green:#15976a;
  --orange:#ed9227;
  --shadow:0 6px 24px rgba(54,46,109,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#151521;
  --card:#242436;
  --text:#f4f3fa;
  --sub:#b0adc2;
  --line:#3b3950;
  --soft:#333052;
  --shadow:0 6px 24px rgba(0,0,0,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:18px}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:18px;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,
textarea:focus-visible,select:focus-visible{
  outline:3px solid #a5a0ff;
  outline-offset:2px;
}
button:active{transform:scale(.985)}
.app{
  width:100%;
  max-width:560px;
  min-height:100dvh;
  margin:auto;
  padding:16px 16px calc(116px + env(safe-area-inset-bottom));
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:6px 0 20px;
}
h1{font-size:27px;margin:0;letter-spacing:-1px}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:19px;margin:0 0 10px}
p{margin:8px 0}
small,.sub{font-size:14px;color:var(--sub)}
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}
.hero{
  background:linear-gradient(135deg,#4f46e5,#7971e9);
  color:white;
}
.hero .sub{color:#dedcff}
.big{
  font-size:32px;
  font-weight:800;
  letter-spacing:-1px;
  overflow-wrap:anywhere;
}
.money{
  font-size:23px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.income{color:var(--green)}
.expense{color:var(--red)}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.row.wrap{flex-wrap:wrap}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.center{text-align:center}
.muted{color:var(--sub)}
.btn{
  min-height:52px;
  padding:12px 17px;
  border:0;
  border-radius:15px;
  background:var(--soft);
  color:var(--primary);
  font-weight:700;
}
.btn.primary{background:var(--primary);color:#fff}
.btn.danger{background:#fff0f1;color:#c6283d}
.btn.outline{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
}
.btn.full{width:100%}
.btn.small{min-height:40px;padding:7px 12px;font-size:14px}
label.field{display:block;margin-bottom:13px}
label.field>span{
  display:block;font-size:15px;font-weight:700;
  margin-bottom:6px;
}
input:not([type="radio"]):not([type="checkbox"]):not([type="file"]),
select,textarea{
  width:100%;
  min-height:52px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--text);
  background:var(--card);
  font-size:18px;
  outline-color:var(--primary);
}
textarea{min-height:135px;resize:vertical}
input[type="file"]{max-width:100%;font-size:15px}
input[type="number"]{font-variant-numeric:tabular-nums}
.chips{
  display:flex;gap:8px;
  overflow-x:auto;padding:3px 0 10px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 13px;
  border-radius:25px;
  font-size:14px;
  min-height:42px;
}
.chip.active{
  background:var(--primary);color:white;
  border-color:var(--primary);
}
.monthbar{display:flex;align-items:center;justify-content:center;gap:22px}
.monthbar button{
  width:48px;height:48px;border:0;border-radius:14px;
  background:var(--card);color:var(--text);font-size:30px;
}
.monthbar strong{font-size:21px;min-width:125px;text-align:center}
.entry{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
  cursor:pointer;
}
.entry:last-child{border:0}
.entry-icon{
  width:47px;height:47px;flex:none;
  border-radius:15px;background:var(--soft);
  display:grid;place-items:center;font-size:23px;
}
.entry-main{flex:1;min-width:0}
.entry-main strong,.ellipsis{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.entry .money{font-size:22px;text-align:right}
.progress{
  background:var(--line);
  border-radius:20px;height:12px;overflow:hidden;
  margin:10px 0 5px;
}
.progress>div{
  height:100%;background:var(--primary);
  border-radius:20px;transition:width .2s;
}
.progress .warn{background:var(--orange)}
.progress .over{background:var(--red)}
.bottom{
  position:fixed;z-index:20;bottom:0;left:50%;
  transform:translateX(-50%);
  width:100%;max-width:560px;
  display:grid;grid-template-columns:repeat(5,1fr);
  align-items:end;
  background:var(--card);
  border-top:1px solid var(--line);
  padding:7px 5px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 28px rgba(0,0,0,.045);
}
.tab{
  border:0;background:none;color:var(--sub);
  min-height:60px;font-size:13px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:2px;
}
.tab .ico{font-size:25px}
.tab.active{color:var(--primary);font-weight:800}
.plus{
  width:66px;height:66px;margin:0 auto 3px;
  border-radius:23px;background:var(--primary);
  color:white;font-size:38px;border:0;
  box-shadow:0 6px 20px #4f46e555;
}
.overlay{
  position:fixed;z-index:40;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  background:#08071696;
}
.sheet{
  background:var(--bg);color:var(--text);
  border-radius:26px 26px 0 0;
  width:100%;max-width:560px;
  max-height:94dvh;overflow-y:auto;
  padding:16px 17px calc(22px + env(safe-area-inset-bottom));
}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:15px;
}
.sheet-head h2{margin:0}
.close{
  border:0;border-radius:12px;
  background:var(--soft);color:var(--text);
  width:44px;height:44px;font-size:23px;
}
.toast{
  position:fixed;z-index:100;bottom:calc(103px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  width:max-content;max-width:90%;
  padding:13px 17px;border-radius:14px;
  background:#272538;color:white;font-size:15px;
  box-shadow:var(--shadow);text-align:center;
}
.calendar{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}
.cal-head{text-align:center;font-size:13px;color:var(--sub);padding:6px 0}
.day{
  min-height:73px;padding:5px 2px;
  border:1px solid var(--line);
  border-radius:11px;background:var(--card);
  color:var(--text);font-size:14px;
  overflow:hidden;
}
.day.selected{outline:2px solid var(--primary)}
.day .tiny{
  display:block;font-size:11px;margin-top:6px;
  overflow:hidden;white-space:nowrap;letter-spacing:-.6px;
}
.donut{display:block;max-width:260px;width:100%;margin:auto}
.legend{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
}
.legend button{
  border:1px solid var(--line);
  border-radius:12px;padding:10px 8px;
  background:var(--card);color:var(--text);
  text-align:left;font-size:13px;
}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.chart-scroll{overflow-x:auto}
.bar-chart{width:100%;min-width:340px;display:block}
.bar-hit{cursor:pointer}
.thumb{
  width:68px;height:68px;object-fit:cover;
  border-radius:12px;cursor:zoom-in;
}
.preview{
  display:block;max-height:280px;max-width:100%;
  margin:10px auto;object-fit:contain;
  border-radius:12px;cursor:zoom-in;
}
.photo-zoom{
  position:fixed;z-index:90;inset:0;
  display:grid;place-items:center;
  background:#090909eb;padding:15px;
}
.photo-zoom img{max-width:100%;max-height:90dvh;object-fit:contain}
.lock{
  position:fixed;z-index:80;inset:0;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.lock>.card{width:100%;max-width:400px}
.empty{text-align:center;color:var(--sub);padding:25px 10px}
.warning{
  border-radius:13px;padding:12px;
  background:var(--soft);font-size:14px;
  color:var(--text);margin:9px 0;
}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
svg text{font-family:inherit}
@media(max-width:360px){
  .app{padding-left:10px;padding-right:10px}
  .card{padding:15px}
  .money{font-size:22px}
  .entry .money{font-size:19px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal"></div>
<div id="lockArea"></div>
<div id="toastArea"></div>
<div id="zoomArea"></div>

<input id="cameraInput" type="file" accept="image/*"
 capture="environment" hidden>
<input id="galleryInput" type="file" accept="image/*"
 multiple hidden>
<input id="csvInput" type="file" accept=".csv,text/csv" hidden>
<input id="jsonInput" type="file" accept=".json,application/json" hidden>

<script>
"use strict";

/* ===== 기본 설정 ===== */
const KEY="my_household_book_v1";
const PAYMENTS=["카드","현금","계좌이체","간편결제"];
const BASE_EXP=[
 "🍚 식비","☕ 카페·간식","🚌 교통","🛍️ 쇼핑",
 "💇 패션·미용","🛒 생활·마트","🏠 주거·통신",
 "🏥 의료·건강","🎬 문화·여가","📚 교육·도서",
 "🎁 경조사·선물","📦 기타"
];
const BASE_INC=["💰 급여","🎉 용돈","💵 기타수입"];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString("ko-KR")+"원";
const num=n=>Number(String(n??"").replace(/[^0-9-]/g,""))||0;
const pad=n=>String(n).padStart(2,"0");
function today(){
 const d=new Date();
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dateOf(d){
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function localDate(s){
 const [y,m,d]=String(s).split("-").map(Number);
 return new Date(y,m-1,d);
}
function addDays(s,n){
 const d=localDate(s);d.setDate(d.getDate()+n);return dateOf(d);
}
function shiftMonth(s,n){
 const d=localDate(s.slice(0,7)+"-01");
 d.setMonth(d.getMonth()+n);
 return dateOf(d).slice(0,7);
}
function monthDays(m){
 const [y,mo]=m.split("-").map(Number);
 return new Date(y,mo,0).getDate();
}
function dateLabel(s){
 if(!/^\d{4}-\d\d-\d\d$/.test(s||""))return "날짜 미확인";
 const d=localDate(s);
 return `${d.getMonth()+1}월 ${d.getDate()}일 (${["일","월","화","수","목","금","토"][d.getDay()]})`;
}
function validDate(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return false;
 return dateOf(localDate(s))===s;
}
function id(){
 return "t_"+Date.now().toString(36)+"_"+
 Math.random().toString(36).slice(2,10);
}
function norm(s){
 return String(s||"").toLowerCase()
 .replace(/\([^)]*\)/g,"")
 .replace(/\s*(본점|지점|점포|점|역점)\s*$/g,"")
 .replace(/[^가-힣a-z0-9]/g,"").slice(0,40);
}
function catName(s){return String(s||"").replace(/^[^\w가-힣]+[\s]*/u,"");}
function catIcon(s){return String(s||"").split(" ")[0]||"📦";}
function escapeAttr(s){return esc(s)}
function hashCode(s){
 let h=0;for(const c of s)h=((h<<5)-h+c.charCodeAt(0))|0;
 return Math.abs(h);
}
const COLORS=[
 "#4f46e5","#9286ed","#ea7c91","#e7ab50","#33a68f",
 "#6787db","#b97ad7","#d86a63","#75ae66","#5caeb9",
 "#b4a466","#a6a2ba","#6ba8d0","#ba75a8","#e39372"
];
function initial(){
 return {
  transactions:[],
  cats:{expense:[...BASE_EXP],income:[...BASE_INC]},
  budgets:{total:0,category:{}},
  recurring:[],learned:{},ignored:[],
  theme:"auto",recognition:"off",
  geminiKey:"",geminiModel:"gemini-3.5-flash",
  claudeKey:"",claudeModel:"claude-haiku-5-5",
  pinHash:""
 };
}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!x||typeof x!=="object")return initial();
  const base=initial();
  return {
   ...base,...x,
   transactions:Array.isArray(x.transactions)?x.transactions:[],
   cats:{...base.cats,...(x.cats||{})},
   budgets:{...base.budgets,...(x.budgets||{})},
   recurring:Array.isArray(x.recurring)?x.recurring:[],
   learned:x.learned||{},ignored:x.ignored||[]
  };
 }catch{return initial()}
}
let db=load();
let ui={
 tab:"home",month:today().slice(0,7),view:"list",
 category:"전체",payment:"전체",search:"",
 selectedDay:"",statCat:"",
 sheet:"",edit:null,queue:[],queueIndex:0,
 pendingSource:"manual",pendingThumb:null,
 cancelTarget:null,formInfo:"",csvPreview:null
};
let isLocked=!!db.pinHash;
let awayAt=0;
let toastTimer;

/* ===== 저장: 용량 부족 시 오래된 사진부터 제거 ===== */
function persist(){
 let removed=0;
 while(true){
  try{
   localStorage.setItem(KEY,JSON.stringify(db));
   if(removed)toast(`저장 공간 부족으로 오래된 사진 ${removed}개를 정리했어요`);
   return true;
  }catch(e){
   const old=db.transactions.filter(t=>t.thumb)
    .sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)))[0];
   if(!old){
    toast("저장 공간이 부족해요. JSON 백업 후 데이터를 정리해 주세요");
    return false;
   }
   old.thumb=null;removed++;
  }
 }
}
function mutate(fn){
 const old=JSON.stringify(db);
 fn();
 if(!persist()){
  db=JSON.parse(old);return false;
 }
 return true;
}
function toast(msg){
 clearTimeout(toastTimer);
 $("#toastArea").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;
 toastTimer=setTimeout(()=>$("#toastArea").innerHTML="",3500);
}
function confirm2(a,b){
 return confirm(a)&&confirm(b);
}
function sum(list,type){
 return list.filter(t=>t.type===type)
  .reduce((a,t)=>a+(Number(t.amount)||0),0);
}
function monthTx(m=ui.month){
 return db.transactions.filter(t=>t.date?.slice(0,7)===m);
}
function sorted(list){
 return [...list].sort((a,b)=>
  String(b.date).localeCompare(String(a.date))||
  String(b.createdAt).localeCompare(String(a.createdAt))
 );
}
function categories(type){return db.cats[type]||[]}
function chooseCat(type,value){
 if(categories(type).includes(value))return value;
 const found=categories(type).find(c=>catName(c)===catName(value));
 return found||categories(type).at(-1)||"";
}
function guessCat(merchant,type="expense"){
 if(type==="income"){
  return /급여|월급|월봉/.test(merchant)?
   chooseCat(type,"급여"):chooseCat(type,"기타수입");
 }
 const k=norm(merchant);
 if(db.learned[k]&&categories(type).includes(db.learned[k]))
  return db.learned[k];
 const tests=[
  [/스타벅스|메가커피|이디야|투썸|커피|카페|빽다방/, "카페·간식"],
  [/김밥|식당|치킨|피자|버거|맥도날드|점심|저녁|배달|국밥/,"식비"],
  [/택시|버스|지하철|기차|주유|톨게이트/,"교통"],
  [/gs25|cu|세븐일레븐|이마트|홈플러스|마트|편의점|다이소/,"생활·마트"],
  [/넷플릭스|영화|공연|여행|유튜브|디즈니/,"문화·여가"],
  [/병원|약국|의원|치과/,"의료·건강"],
  [/서점|교보문고|학원|도서/,"교육·도서"],
  [/통신|전기|가스|관리비|월세|인터넷/,"주거·통신"],
  [/옷|미용실|헤어|화장품/,"패션·미용"],
  [/선물|축의|부의|경조/,"경조사·선물"],
  [/쿠팡|쇼핑|11번가|무신사/,"쇼핑"]
 ];
 const item=tests.find(([re])=>re.test(k));
 return chooseCat(type,item?item[1]:"기타");
}
function learn(t){
 if(t.type!=="expense"||!t.merchant.trim())return "";
 const k=norm(t.merchant);
 if(!k)return "";
 const old=db.learned[k];
 db.learned[k]=t.cat;
 return old!==t.cat?`앞으로 ${t.merchant}은(는) ${catName(t.cat)}으로 자동 분류해요`:"";
}
function duplicated(t,exclude){
 return db.transactions.find(x=>x.id!==exclude&&
  x.type===t.type&&Number(x.amount)===Number(t.amount)&&
  Math.abs((localDate(x.date)-localDate(t.date))/86400000)<=1&&
  (norm(x.merchant)===norm(t.merchant)||
   (norm(x.merchant).includes(norm(t.merchant))&&norm(t.merchant).length>2)||
   (norm(t.merchant).includes(norm(x.merchant))&&norm(x.merchant).length>2))
 );
}
function budgetWarning(t){
 if(t.type!=="expense"||t.date.slice(0,7)!==today().slice(0,7))return "";
 const tx=monthTx(t.date.slice(0,7));
 const total=sum(tx,"expense"),limit=num(db.budgets.total);
 const catLimit=num(db.budgets.category[t.cat]);
 if(catLimit&&sum(tx.filter(x=>x.cat===t.cat),"expense")>catLimit)
  return `${catName(t.cat)} 예산을 초과했어요`;
 if(limit&&total>limit)return "이번 달 총예산을 초과했어요";
 return "";
}

/* ===== 화면 모드 ===== */
function theme(){
 let mode=db.theme;
 if(mode==="auto")
  mode=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
 document.documentElement.dataset.theme=mode;
}
theme();
try{
 matchMedia("(prefers-color-scheme: dark)")
 .addEventListener("change",()=>db.theme==="auto"&&theme());
}catch{}

/* ===== 홈 / 내역 공통 ===== */
function monthBar(){
 return `<div class="monthbar">
 <button data-act="prev" aria-label="이전 달">‹</button>
 <strong>${esc(ui.month.replace("-","년 "))}월</strong>
 <button data-act="next" aria-label="다음 달">›</button>
 </div>`;
}
function progress(used,max){
 if(!max)return `<p class="sub">예산을 설정하면 진행률을 볼 수 있어요.</p>`;
 const p=Math.round(used/max*100);
 const cls=p>=100?"over":p>=80?"warn":"";
 return `<div class="row"><strong>${money(used)}</strong>

function donut(values,total,selected){
 let start=-Math.PI/2;
 let arcs="";
 values.forEach(([cat,value],i)=>{
  const angle=value/total*Math.PI*2;
  const end=start+angle;
  if(angle>=Math.PI*2-.0001){
   arcs+=`<circle cx="130" cy="130" r="92" fill="none"
    stroke="${COLORS[i%COLORS.length]}" stroke-width="37"
    data-act="statCat" data-cat="${esc(cat)}" style="cursor:pointer"/>`;
  }else{
   const x1=130+92*Math.cos(start),y1=130+92*Math.sin(start);
   const x2=130+92*Math.cos(end),y2=130+92*Math.sin(end);
   arcs+=`<path d="M${x1},${y1} A92,92 0 ${angle>Math.PI?1:0},1 ${x2},${y2}"
    fill="none" stroke="${COLORS[i%COLORS.length]}"
    stroke-width="${selected===cat?43:37}"
    data-act="statCat" data-cat="${esc(cat)}" style="cursor:pointer"/>`;
  }
  start=end;
 });
 const v=values.find(x=>x[0]===selected)?.[1]||0;
 return `<svg class="donut" viewBox="0 0 260 260" role="img" aria-label="카테고리 지출 도넛 차트">
 ${arcs}
 <text x="130" y="117" text-anchor="middle" fill="var(--sub)" font-size="14">${esc(catName(selected))}</text>
 <text x="130" y="142" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="bold">${(v/total*100).toFixed(1)}%</text>
 <text x="130" y="163" text-anchor="middle" fill="var(--text)" font-size="14">${esc(money(v))}</text>
 </svg>`;
}

function processRecurring(){
 const now=today(),current=now.slice(0,7);
 let changed=false;
 for(const r of db.recurring){
  if(!r.id||!r.start)continue;
  let month=r.start.slice(0,7),guard=0;
  while(month<=current&&guard++<240){
   const day=Math.min(Math.max(1,num(r.day)),monthDays(month));
   const date=`${month}-${pad(day)}`;
   const exists=db.transactions.some(t=>
    t.recurringId===r.id&&t.date.slice(0,7)===month);
   if(date<=now&&!exists){
    db.transactions.push({
     id:id(),type:"expense",date,merchant:r.name,
     amount:num(r.amount),cat:r.cat,payment:r.payment||"카드",
     memo:"자동 고정지출",source:"recurring",thumb:null,
     createdAt:new Date().toISOString(),recurringId:r.id
    });
    changed=true;
   }
   month=shiftMonth(month,1);
  }
 }
 if(changed)persist();
}
function detectRepeats(){
 const end=today().slice(0,7);
 const start=shiftMonth(end,-5);
 const ex=db.transactions.filter(t=>t.type==="expense"&&
  t.source!=="recurring"&&t.date.slice(0,7)>=start&&
  t.date.slice(0,7)<=end);
 const groups={};
 ex.forEach(t=>(groups[norm(t.merchant)]??=[]).push(t));
 const results=[];
 for(const [key,list] of Object.entries(groups)){
  if(!key||db.ignored.includes(key)||
   db.recurring.some(r=>norm(r.name)===key))continue;
  const byMonth={};
  for(const t of sorted(list)) (byMonth[t.date.slice(0,7)]??=[]).push(t);
  const months=Object.keys(byMonth).sort();
  const singles=months.filter(m=>byMonth[m].length===1);
  let found=false,chosen=[];
  for(let i=0;i<singles.length;i++){
   const run=[byMonth[singles[i]][0]];
   for(let j=i+1;j<singles.length;j++){
    if(shiftMonth(run.at(-1).date.slice(0,7),1)!==singles[j])break;
    const t=byMonth[singles[j]][0],base=run[0];
    const priceOk=Math.abs(t.amount-base.amount)/Math.max(base.amount,1)<=.1;
    const dayOk=Math.abs(localDate(t.date).getDate()-
     localDate(base.date).getDate())<=6;
    if(!priceOk||!dayOk)break;
    run.push(t);
   }
   if(run.length>=3){found=true;chosen=run;break}
  }
  if(!found){
   const a=singles.map(m=>byMonth[m][0]).sort((a,b)=>b.date.localeCompare(a.date));
   for(let i=0;i<a.length-1;i++){
    if(shiftMonth(a[i+1].date.slice(0,7),1)===
       a[i].date.slice(0,7)&&a[i].amount===a[i+1].amount){
     found=true;chosen=[a[i+1],a[i]];break;
    }
   }
  }
  if(found){
   const recent=chosen.at(-1);
   results.push({
    name:recent.merchant,amount:recent.amount,
    day:localDate(recent.date).getDate(),
    cat:recent.cat,months:chosen.length,
    latest:recent.date
   });
  }
 }
 return results.sort((a,b)=>b.latest.localeCompare(a.latest)).slice(0,3);
}

/* ===== 한 줄 입력 ===== */
const KOREAN_DIGIT={
 "영":0,"공":0,"일":1,"이":2,"삼":3,"사":4,
 "오":5,"육":6,"륙":6,"칠":7,"팔":8,"구":9,
 "한":1,"두":2,"세":3,"네":4,
 "하나":1,"둘":2,"셋":3,"넷":4,
 "다섯":5,"여섯":6,"일곱":7,"여덟":8,"아홉":9
};
function koreanBelow10(s){
 if(!s)return 1;
 if(/^\d+$/.test(s))return Number(s);
 if(KOREAN_DIGIT[s]!==undefined)return KOREAN_DIGIT[s];
 let value=0;
 for(const ch of s){
  if(KOREAN_DIGIT[ch]===undefined)return NaN;
  value=value*10+KOREAN_DIGIT[ch];
 }
 return value;
}
function koreanNumber(str){
 let s=str.replace(/\s/g,"");
 if(!s)return NaN;
 s=s.replace(/십/g,"천"); // 아래에서 별도로 천·백·십 처리
 s=str.replace(/\s/g,"");
 let total=0;
 for(const [unit,mult] of [["만",10000],["천",1000],["백",100],["십",10]]){
  const pos=s.indexOf(unit);
  if(pos>=0){
   const n=koreanBelow10(s.slice(0,pos));
   if(!Number.isFinite(n))return NaN;
   total+=n*mult;s=s.slice(pos+unit.length);
  }
 }
 if(s){
  const n=koreanBelow10(s);
  if(!Number.isFinite(n))return NaN;
  total+=n;
 }
 return total;
}
function parseAmountText(text){
 const re=/(\d{1,3}(?:,\d{3})+(?:원)?|\d{4,}(?:원)?|[일이삼사오육칠팔구한두세네만천백십\d]+원)/g;
 const matches=[...text.matchAll(re)];
 for(const match of matches){
  const raw=match[0];
  const value=/^[0-9,]+원?$/.test(raw)?
   num(raw):koreanNumber(raw.replace(/원$/,""));
  if(Number.isFinite(value)&&value>0)return {amount:value,raw};
 }
 return {amount:"",raw:""};
}
function parseNaturalDate(s){
 const now=localDate(today());
 let m=s.match(/(?:오늘|어제|그저께|\d+일\s*전)/);
 if(m){
  const value=m[0];
  const diff=value==="오늘"?0:value==="어제"?1:
   value==="그저께"?2:Number(value.match(/\d+/)?.[0]||0);
  return {date:addDays(today(),-diff),raw:value};
 }
 m=s.match(/(\d{1,2})월\s*(\d{1,2})일|(\d{1,2})\/(\d{1,2})/);
 if(m){
  const month=Number(m[1]||m[3]),day=Number(m[2]||m[4]);
  let year=now.getFullYear();
  let date=`${year}-${pad(month)}-${pad(day)}`;
  if(validDate(date)&&date>today())date=`${year-1}-${pad(month)}-${pad(day)}`;
  return {date:validDate(date)?date:today(),raw:m[0]};
 }
 m=s.match(/지난\s*(일|월|화|수|목|금|토)요일/);
 if(m){
  const week=["일","월","화","수","목","금","토"].indexOf(m[1]);
  let diff=(now.getDay()-week+7)%7;
  if(diff===0)diff=7;
  return {date:addDays(today(),-diff),raw:m[0]};
 }
 return {date:today(),raw:""};
}
function naturalParse(s){
 const d=parseNaturalDate(s),a=parseAmountText(s);
 const type=/월급|급여|용돈|입금|받았어|받았어요/.test(s)?"income":"expense";
 const payment=/카카오페이|네이버페이|토스페이|간편결제/.test(s)?"간편결제":
  /계좌이체|송금|이체/.test(s)?"계좌이체":
  /현금/.test(s)?"현금":"카드";
 const meals=["아침","점심","저녁","야식"];
 const memo=meals.filter(w=>s.includes(w)).join(" ");
 let merchant=s.replace(d.raw,"").replace(a.raw,"")
  .replace(/카카오페이|네이버페이|토스페이|간편결제|계좌이체|송금|이체|현금|카드/g,"")
  .replace(/월급|급여|용돈|입금|받았어요|받았어/g,"")
  .replace(/아침|점심|저녁|야식/g,"")
  .replace(/에서|으로|로\s*결제|결제했어|썼어|사용했어|받음/g,"")
  .replace(/^[\s,·]+|[\s,·]+$/g,"").trim();
 if(!merchant&&type==="income")merchant=/월급|급여/.test(s)?"급여":"수입";
 return {
  ...blankTx(),type,date:d.date,amount:a.amount,
  merchant,cat:guessCat(merchant,type),payment,memo,source:"quick"
 };
}

/* ===== 문자 파서 ===== */
function smsSplit(s){
 return s.replace(/\r\n/g,"\n")
 .split(/(?:\n\s*\n+)|(?=\[Web발신\])/g)
 .map(x=>x.trim()).filter(Boolean);
}
function smsDate(s){
 let m=s.match(/\b(20\d{2})[./-](\d{1,2})[./-](\d{1,2})\b/);
 if(m){
  const d=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return validDate(d)?d:today();
 }
 m=s.match(/\b(\d{1,2})[/-](\d{1,2})\b/);
 if(m){
  let year=localDate(today()).getFullYear();
  let d=`${year}-${pad(m[1])}-${pad(m[2])}`;
  if(validDate(d)&&d>today())
   d=`${year-1}-${pad(m[1])}-${pad(m[2])}`;
  return validDate(d)?d:today();
 }
 return today();
}
function cancelMatch(t){
 const from=addDays(t.date,-62);
 const target=norm(t.merchant);
 return sorted(db.transactions).find(x=>
  x.type==="expense"&&x.amount===t.amount&&
  x.date>=from&&x.date<=addDays(t.date,1)&&
  target.length>=2&&
  (norm(x.merchant)===target||
   (norm(x.merchant).includes(target)&&target.length>=3)||
   (target.includes(norm(x.merchant))&&norm(x.merchant).length>=3))
 );
}
function smsParseOne(s){
 if(/인증번호|인증코드|\(광고\)|\[광고\]|광고수신/.test(s))return null;
 if(!/승인|결제|출금|이용|취소|환불|입금|이체|송금|받았어요|보냈어요/.test(s))
  return null;
 if(/ATM|현금\s*인출|카드\s*대금|카드대금|결제대금\s*납부/.test(s))
  return null;
 const isCancel=/취소|환불/.test(s);
 const isIncome=/입금|받았어요/.test(s)&&
  !/출금|보냈어요|송금/.test(s);
 const bank=/입금|출금|이체|송금|받았어요|보냈어요/.test(s);
 const fx=s.match(/(?:USD|EUR|JPY|CNY|GBP)\s*[\d,.]+|[\d,.]+\s*(?:USD|EUR|JPY|CNY|GBP)/i);
 let filtered=s.replace(/(?:누적|잔액|한도|포인트|적립)[^\n\r]{0,28}?\d[\d,]*원/g,"")
  .replace(/\d[\d,]*원[^\n\r]{0,15}?(?:누적|잔액|한도|포인트|적립)/g,"");
 let match=filtered.match(/(?:금액|승인금액|결제금액|출금액|입금액|이용금액)\s*[:：]?\s*([\d,]+)\s*원/);
 if(!match)match=filtered.match(/([\d,]+)\s*원/);
 const amount=fx?"":(match?num(match[1]):"");
 const date=smsDate(s);
 const type=isIncome?"income":"expense";
 const payment=/현금영수증/.test(s)?"현금":
  bank?"계좌이체":/카카오페이|네이버페이|토스페이/.test(s)?"간편결제":"카드";
 let merchant=s.replace(/\[Web발신\]|\[.*?카드\]/g," ")
  .replace(/(?:신한|삼성|현대|국민|KB|롯데|우리|하나|BC|NH|농협|카카오|토스)\s*(?:카드|은행)/gi," ")
  .replace(/홍\*동님|[가-힣]\*[가-힣]님/g," ")
  .replace(/\b20\d{2}[./-]\d{1,2}[./-]\d{1,2}\b/g," ")
  .replace(/\b\d{1,2}[/-]\d{1,2}\b/g," ")
  .replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g," ")
  .replace(/[\d,]+\s*원/g," ")
  .replace(/(?:USD|EUR|JPY|CNY|GBP)\s*[\d,.]+/gi," ")
  .replace(/승인|취소|환불|일시불|할부|출금|입금|이체|송금|이용|결제|완료|보냈어요|받았어요|현금영수증/g," ")
  .replace(/누적|잔액|한도|포인트|적립/g," ")
  .replace(/\*{2,}\d{2,4}|\d{4}[-*]\d{4}/g," ")
  .replace(/(?:금액|금액:|가맹점|사용처|거래처)\s*[:：]?/g," ")
  .replace(/[\[\]\n\r]/g," ")
  .replace(/\s+/g," ").trim();
 merchant=merchant.slice(0,70)||"사용처 확인 필요";
 const memo=(fx?"외화 금액: "+fx[0]+". ":"")+
  (isCancel?"취소·환불 문자":"문자에서 읽음");
 const tx={
  ...blankTx(),type,date,amount,merchant,
  cat:guessCat(merchant,type),payment,memo,source:"sms"
 };
 if(isIncome&&/급여|월급/.test(s))tx.cat=chooseCat("income","급여");
 if(isCancel){
  const found=amount?cancelMatch(tx):null;
  if(!found)return {skip:"취소 원거래를 찾지 못해 건너뛰었습니다."};
  tx.cancelTarget=found;
 }
 return {tx,needsAI:!amount&&!isCancel,raw:s};
}

async function handleSMS(s){
 const blocks=smsSplit(s),queue=[],skipped=[];
 for(const raw of blocks){
  let r=smsParseOne(raw);
  if(!r){skipped.push("인식 대상이 아닌 문자");continue}
  if(r.skip){skipped.push(r.skip);continue}
  if(r.needsAI&&["gemini","claude"].includes(db.recognition)){
   try{
    const cleaned=raw
     .replace(/\b\d{4}[- ]?\d{4}[- ]?\d{4}[- ]?\d{4}\b/g,"[카드번호]")
     .replace(/[가-힣]\*[가-힣]님/g,"[이름]")
     .replace(/누적[^\n]*/g,"[누적금액]");
    const out=await aiText(cleaned);
    if(out?.amount)r.tx.amount=num(out.amount);
    if(out?.merchant)r.tx.merchant=String(out.merchant);
    if(out?.date&&validDate(out.date))r.tx.date=out.date;
    r.tx.cat=guessCat(r.tx.merchant,r.tx.type);
   }catch(e){skipped.push("AI 재판독 실패: "+e.message)}
  }
  queue.push({tx:r.tx,info:r.tx.amount?
   "문자에서 읽은 정보입니다. 저장 전에 확인해 주세요.":
   "금액을 읽지 못했습니다. 직접 입력해 주세요."});
 }
 if(!queue.length){
  toast("등록할 문자가 없어요. "+(skipped[0]||""));return;
 }
 ui.queue=queue;ui.queueIndex=0;
 openForm(queue[0].tx,
  `${queue.length}건 중 1번째 확인 · ${skipped.length}건 건너뜀. `+
  queue[0].info);
}

/* ===== 사진 처리 및 AI 판독 ===== */
async function resizeImage(file,max,quality){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   URL.revokeObjectURL(url);
   const ratio=Math.min(1,max/Math.max(img.width,img.height));
   const canvas=document.createElement("canvas");
   canvas.width=Math.max(1,Math.round(img.width*ratio));
   canvas.height=Math.max(1,Math.round(img.height*ratio));
   const ctx=canvas.getContext("2d");
   ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL("image/jpeg",quality);
   resolve(data);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error("이미지 파일을 열지 못했어요"))};
  img.src=url;
 });
}
function parseJSON(s){
 const text=String(s).replace(/```(?:json)?/gi,"").replace(/```/g,"");
 const first=text.indexOf("{"),last=text.lastIndexOf("}");
 if(first<0||last<first)throw Error("AI 응답에서 JSON을 찾지 못했어요");
 return JSON.parse(text.slice(first,last+1));
}

JSON 객체 하나만 출력:
{"merchant":null,"date":null,"amount":null,"category":null,
"payment":null,"items":[],"confidence":0}
merchant는 상호명, date는 YYYY-MM-DD,
amount는 할인·포인트 차감 후 최종 결제금액(숫자만),

payment는 카드|현금|계좌이체|간편결제,

최종 결제금액 외의 합계나 잔액을 선택하지 마세요.`;

async function requestAI(text,imageData,provider=db.recognition){
 const key=provider==="gemini"?db.geminiKey:db.claudeKey;
 const model=provider==="gemini"?db.geminiModel:db.claudeModel;
 if(!key)throw Error("API 키가 없습니다. 설정에서 입력해 주세요");
 if(!model.trim())throw Error("AI 모델명을 입력해 주세요");
 if(!navigator.onLine)throw Error("인터넷 연결을 확인해 주세요");
 let url,headers,body;
 if(provider==="gemini"){
  url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  headers={"x-goog-api-key":key,"Content-Type":"application/json"};
  const parts=[{text}];
  if(imageData)parts.push({inline_data:{
   mime_type:"image/jpeg",data:imageData.split(",")[1]
  }});
  body={
   contents:[{parts}],
   generationConfig:{temperature:0,responseMimeType:"application/json"}
  };
 }else if(provider==="claude"){
  url="https://api.anthropic.com/v1/messages";
  headers={
   "x-api-key":key,
   "anthropic-version":"2023-06-01",
   "anthropic-dangerous-direct-browser-access":"true",
   "content-type":"application/json"
  };
  const content=[];
  if(imageData)content.push({type:"image",source:{
   type:"base64",media_type:"image/jpeg",data:imageData.split(",")[1]
  }});
  content.push({type:"text",text});
  body={
   model,max_tokens:1000,
   messages:[{role:"user",content}]
  };
 }else throw Error("지원하지 않는 AI 방식입니다");
 let response;
 try{
  response=await fetch(url,{method:"POST",headers,
   body:JSON.stringify(body)});
 }catch{
  throw Error("API 서버에 연결할 수 없어요. 인터넷 또는 브라우저 제한을 확인해 주세요");
 }
 if(!response.ok){
  const err=await response.text();
  const summary=err.slice(0,150);
  if(response.status===401||response.status===403)
   throw Error("API 키 또는 접근 권한을 확인해 주세요");
  if(response.status===429)
   throw Error("API 사용 한도를 초과했어요");
  if(response.status===404)
   throw Error("모델명을 찾지 못했어요. 모델 설정을 확인해 주세요");
  throw Error(`AI 오류 (${response.status}): ${summary}`);
 }
 const data=await response.json();
 const out=provider==="gemini"?
  (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""):
  (data.content||[]).filter(p=>p.type==="text").map(p=>p.text||"").join("");
 return parseJSON(out);
}
async function aiText(text){
 return requestAI(
  `다음 한국 카드·은행 문자에서 금액을 추출하세요.
JSON 객체 하나만 출력하세요:
{"merchant":null,"date":null,"amount":null}
누적금액·잔액은 제외하고 실제 거래금액만 읽으세요.
${text}`,null
 );
}
async function loadOCR(){
 if(window.Tesseract)return window.Tesseract;
 await new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
  script.onload=resolve;
  script.onerror=()=>reject(Error("OCR 프로그램을 다운로드하지 못했어요"));
  document.head.appendChild(script);
 });
 return window.Tesseract;
}
async function ocrRead(data){
 const tess=await loadOCR();
 const worker=await tess.createWorker("kor+eng",1);
 try{
  const result=await worker.recognize(data);
  const text=result.data.text||"";
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const merchant=lines[0]||"";
  const dm=text.match(/\b(20\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})\b/);
  const date=dm?`${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`:today();
  const totalLine=lines.find(x=>/결제금액|총결제금액|합계|총액/.test(x));
  let a=totalLine?.match(/([\d,]+)\s*원?/)?.[1];
  if(!a)a=text.match(/(?:결제금액|합계)[^\n]*?([\d,]+)\s*원/)?.[1];
  return {
   merchant,date:validDate(date)?date:today(),
   amount:a?num(a):null,category:null,payment:"카드",
   confidence:.35,items:[],ocrText:text.slice(0,1000)
  };
 }finally{await worker.terminate()}
}
function sanitizeAIResult(data,thumb){
 const merchant=String(data.merchant||"").slice(0,150);
 const amount=Number(String(data.amount??"").replace(/[^\d]/g,""));
 return {
  ...blankTx(),merchant,
  amount:Number.isSafeInteger(amount)&&amount>0?amount:"",
  date:validDate(data.date)?data.date:today(),
  cat:chooseCat("expense",data.category)||
   guessCat(merchant),
  payment:PAYMENTS.includes(data.payment)?data.payment:"카드",
  thumb,source:"receipt",
  memo:Array.isArray(data.items)?
   data.items.slice(0,8).map(x=>
    typeof x==="string"?x:JSON.stringify(x)).join(", ").slice(0,500):""
 };
}

async function sha256(s){
 if(!crypto?.subtle)throw Error("이 환경에서 SHA-256을 사용할 수 없어요. HTTPS 또는 보안 브라우저 환경이 필요합니다");
 const bytes=new TextEncoder().encode(s);
 const hash=await crypto.subtle.digest("SHA-256",bytes);
 return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ===== CSV / JSON 백업 ===== */
const CSV_FIELDS=[
 "id","type","date","merchant","amount","cat","payment",
 "memo","source","createdAt"
];
function csvEscape(value){
 const s=String(value??"");
 return `"${s.replace(/"/g,'""')}"`;
}
function download(name,content,mime){
 const blob=new Blob([content],{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=name;document.body.appendChild(a);a.click();
 a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function exportCSV(){
 const lines=[CSV_FIELDS.map(csvEscape).join(",")];
 db.transactions.forEach(t=>
  lines.push(CSV_FIELDS.map(k=>csvEscape(t[k])).join(",")));
 download(`가계부_${today()}.csv`,"\uFEFF"+lines.join("\r\n"),
  "text/csv;charset=utf-8");
 toast("CSV 파일을 내보냈어요");
}
function exportJSON(){

function parseCSV(text){
 const rows=[];let row=[],cell="",quoted=false;
 text=text.replace(/^\uFEFF/,"");
 for(let i=0;i<text.length;i++){
  const c=text[i],next=text[i+1];
  if(c==='"'){
   if(quoted&&next==='"'){cell+='"';i++}
   else quoted=!quoted;
  }else if(c===","&&!quoted){row.push(cell);cell=""}
  else if((c==="\n"||c==="\r")&&!quoted){
   if(c==="\r"&&next==="\n")i++;
   row.push(cell);cell="";
   if(row.some(v=>v!==""))rows.push(row);
   row=[];
  }else cell+=c;
 }
 if(quoted)throw Error("CSV 따옴표가 올바르게 닫히지 않았어요");
 row.push(cell);if(row.some(v=>v!==""))rows.push(row);
 if(!rows.length)return [];
 const header=rows.shift().map(s=>s.trim());
 for(const f of ["type","date","merchant","amount"])
  if(!header.includes(f))throw Error("필수 CSV 열이 없습니다: "+f);
 return rows.map(row=>{
  const obj={};
  header.forEach((k,i)=>obj[k]=row[i]||"");
  const type=obj.type==="income"?"income":"expense";
  const amount=Number(String(obj.amount).replace(/[,원\s]/g,""));
  if(!Number.isSafeInteger(amount)||amount<=0||!validDate(obj.date))
   return null;
  return {
   ...blankTx(),id:obj.id||id(),type,date:obj.date,
   merchant:String(obj.merchant||"").slice(0,200),
   amount,cat:chooseCat(type,obj.cat),
   payment:PAYMENTS.includes(obj.payment)?obj.payment:"카드",
   memo:String(obj.memo||""),
   source:"import",thumb:null,
   createdAt:obj.createdAt||new Date().toISOString()
  };
 }).filter(Boolean);
}
async function importFile(file,kind){
 if(!file)return;
 const text=await file.text();
 if(kind==="csv"){
  const rows=parseCSV(text);
  const existingIds=new Set(db.transactions.map(t=>t.id));
  const news=[];
  for(const t of rows){
   if(existingIds.has(t.id))continue;
   if(duplicated(t))continue;
   news.push(t);existingIds.add(t.id);
  }
  if(!confirm(`${rows.length}건을 읽었습니다. 중복 제외 ${news.length}건을 추가할까요?`))
   return;
  if(mutate(()=>db.transactions.push(...news))){
   render();toast(`${news.length}건 가져왔어요`);
  }
 }else{
  const parsed=JSON.parse(text);
  if(parsed.app!=="household-book"||!parsed.data||
    !Array.isArray(parsed.data.transactions))
    throw Error("이 앱에서 만든 JSON 백업 파일이 아닙니다");
  if(!confirm2("현재 거래와 설정을 백업 내용으로 교체할까요?",
   "정말 복원할까요? 현재 거래와 예산 정보가 교체됩니다."))return;
  const keep={
   geminiKey:db.geminiKey,claudeKey:db.claudeKey,pinHash:db.pinHash
  };
  const restored=parsed.data;
  const old=db;
  db={...initial(),...restored,...keep,
   cats:{...initial().cats,...(restored.cats||{})},
   budgets:{total:0,category:{},...(restored.budgets||{})},
   recurring:Array.isArray(restored.recurring)?restored.recurring:[],
   transactions:restored.transactions.filter(t=>
    validDate(t.date)&&Number.isSafeInteger(Number(t.amount))&&
    Number(t.amount)>0&&["expense","income"].includes(t.type)
   ).map(t=>({
    ...blankTx(),...t,
    cat:chooseRestoredCat(t,restored),
    amount:Number(t.amount),source:t.source||"import"
   }))
  };
  if(!persist()){db=old;return}
  processRecurring();
  render();toast("JSON 복원을 완료했어요");
 }
}
function chooseRestoredCat(t,restored){
 const list=restored.cats?.[t.type]||initial().cats[t.type];
 return list.includes(t.cat)?t.cat:list.at(-1);
}

  ["서점",24000,"교육·도서","간편결제"],
  ["쿠팡",39000,"쇼핑","카드"],
  ["넷플릭스",17000,"문화·여가","카드"]
 ];
 mutate(()=>{
  for(let m=0;m<6;m++){
   const month=shiftMonth(today().slice(0,7),-m);
   for(let i=0;i<names.length;i++){
    const [merchant,amount,cat,payment]=names[i];
    const day=Math.min(2+i*3,monthDays(month));
    const date=`${month}-${pad(day)}`;
    if(date>today())continue;
    db.transactions.push({
     ...blankTx(),id:id(),date,merchant,
     amount:amount+(m%3)*500,
     cat:chooseCat("expense",cat),payment,
     memo:"연습용 데이터",source:"manual",sample:true
    });
   }
   const payday=`${month}-01`;
   db.transactions.push({
    ...blankTx(),id:id(),type:"income",date:payday,
    merchant:"월급",amount:2800000,cat:chooseCat("income","급여"),
    payment:"계좌이체",memo:"연습용 데이터",sample:true
   });
  }
 });
 render();toast("6개월 샘플 데이터를 넣었어요");
}

/* ===== 앱 아이콘 / PWA ===== */
function setupPWA(){
 try{
  const c=document.createElement("canvas");
  c.width=c.height=192;
  const ctx=c.getContext("2d");
  ctx.fillStyle="#4f46e5";ctx.fillRect(0,0,192,192);
  ctx.fillStyle="white";ctx.font="bold 108px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("₩",96,101);
  const png=c.toDataURL("image/png");
  const apple=document.createElement("link");
  apple.rel="apple-touch-icon";apple.href=png;
  document.head.appendChild(apple);
  if(location.protocol==="https:"){
   const manifest={
    name:"나의 가계부",short_name:"가계부",
    start_url:location.href,scope:"./",
    display:"standalone",background_color:"#f3f2fa",
    theme_color:"#4f46e5",
    icons:[{src:png,sizes:"192x192",type:"image/png",purpose:"any"}]
   };
   const link=document.createElement("link");
   link.rel="manifest";
   link.href="data:application/manifest+json,"+
    encodeURIComponent(JSON.stringify(manifest));
   document.head.appendChild(link);
  }
 }catch(e){console.warn("PWA 아이콘 생성 실패",e)}
}

/* ===== 클릭 처리 ===== */
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-act]");
 if(!el||isLocked)return;
 const action=el.dataset.act;
 const dx=el.dataset;
 try{
 switch(action){
 case "tab":switchTab(dx.to);break;
 case "prev":ui.month=shiftMonth(ui.month,-1);ui.selectedDay="";render();break;
 case "next":ui.month=shiftMonth(ui.month,1);ui.selectedDay="";render();break;
 case "openAdd":addSheet();break;
 case "close":closeSheet();break;
 case "camera":$("#cameraInput").click();break;
 case "gallery":$("#galleryInput").click();break;
 case "manual":ui.queue=[];openForm(blankTx());break;
 case "sms":smsSheet();break;
 case "edit":editTx(dx.id);break;
 case "zoom":
  e.stopPropagation();
  $("#zoomArea").innerHTML=`<div class="photo-zoom" data-act="unzoom">
   <img src="${esc(dx.img)}" alt="영수증 확대"></div>`;break;
 case "unzoom":$("#zoomArea").innerHTML="";break;
 case "deleteTx":
  if(confirm("이 내역을 삭제할까요?")){
   mutate(()=>db.transactions=db.transactions.filter(t=>t.id!==dx.id));
   closeSheet();render();toast("삭제했어요");
  }break;
 case "catFilter":ui.category=dx.cat;render();break;
 case "paymentFilter":ui.payment=dx.payment;render();break;
 case "view":ui.view=dx.view;render();break;
 case "day":ui.selectedDay=dx.date;render();break;
 case "statCat":ui.statCat=dx.cat;render();break;
 case "barMonth":ui.month=dx.month;render();break;
 case "skipPending":nextPending();break;
 case "confirmCancel":
  if(ui.cancelTarget&&confirm("찾은 지출 내역을 삭제하여 취소 처리할까요?")){
   mutate(()=>db.transactions=db.transactions.filter(t=>t.id!==ui.cancelTarget.id));
   ui.cancelTarget=null;
   if(ui.queue.length)nextPending();else closeSheet();
   render();toast("취소 원거래를 삭제했어요");
  }break;
 case "catManage":categorySheet(dx.type);break;
 case "removeCat":{
  const type=dx.type,cat=dx.cat;
  if(categories(type).length<=1){toast("카테고리는 최소 1개가 필요해요");break}
  if(db.transactions.some(t=>t.cat===cat)){
   toast("이 카테고리를 사용하는 거래가 있어요. 먼저 거래를 변경해 주세요");
   break;
  }
  if(confirm(`${cat} 카테고리를 삭제할까요?`)){
   mutate(()=>{
    db.cats[type]=categories(type).filter(c=>c!==cat);
    delete db.budgets.category[cat];
    for(const k of Object.keys(db.learned))
     if(db.learned[k]===cat)delete db.learned[k];
    db.recurring=db.recurring.map(r=>r.cat===cat?
     {...r,cat:categories("expense").at(-1)}:r);
   });
   categorySheet(type);render();
  }break;
 }
 case "addRecurring":recurringSheet();break;
 case "removeRecurring":
  if(confirm("고정지출 규칙을 삭제할까요? 이미 기록된 거래는 유지됩니다.")){
   mutate(()=>db.recurring=db.recurring.filter(r=>r.id!==dx.id));
   render();toast("규칙을 삭제했어요");
  }break;
 case "repeatIgnore":
  mutate(()=>db.ignored.push(dx.name));render();break;
 case "repeatAdd":{
  const key=norm(dx.name);
  if(mutate(()=>{
   db.recurring.push({
    id:id(),name:dx.name,amount:num(dx.amount),
    day:num(dx.day),cat:dx.cat,payment:"카드",
    start:today().slice(0,7)
   });
   db.ignored=db.ignored.filter(k=>k!==key);
  })){
   processRecurring();render();toast("고정지출에 등록했어요");
  }break;
 }
 case "forget":mutate(()=>delete db.learned[dx.key]);render();break;
 case "unignore":
  mutate(()=>db.ignored=db.ignored.filter(k=>k!==dx.key));
  render();break;
 case "pinSet":pinSheet();break;
 case "pinRemove":pinSheet(true);break;
 case "exportCSV":exportCSV();break;
 case "exportJSON":exportJSON();break;
 case "importCSV":$("#csvInput").click();break;
 case "importJSON":$("#jsonInput").click();break;
 case "sampleAdd":sampleAdd();break;
 case "sampleClear":
  if(confirm("연습용 샘플 데이터만 삭제할까요?")){
   mutate(()=>db.transactions=db.transactions.filter(t=>!t.sample));
   render();toast("샘플 데이터만 삭제했어요");
  }break;
 case "wipe":
  if(confirm2("모든 가계부 데이터를 삭제할까요?",
  "두 번째 확인입니다. 거래·설정·PIN·API 키까지 삭제하며 복구할 수 없습니다. 정말 삭제할까요?")){
   db=initial();localStorage.removeItem(KEY);
   ui.month=today().slice(0,7);ui.tab="home";
   unlockScreen();theme();render();toast("모든 데이터를 삭제했어요");
  }break;
 case "testAI":{
  const provider=db.recognition;
  if(!["gemini","claude"].includes(provider)){
   toast("먼저 Gemini 또는 Claude를 선택하고 저장해 주세요");break;
  }
  toast("AI 연결을 확인하고 있어요");
  const result=await requestAI(
   '연결 테스트입니다. JSON 객체 {"ok":true} 하나만 출력하세요',null);
  toast(result.ok===true?"AI 연결 성공":"API 응답을 받았지만 결과를 확인해 주세요");
  break;
 }
 }
 }catch(err){toast(err.message||"처리 중 문제가 발생했어요")}
});
document.addEventListener("keydown",e=>{
 if((e.key==="Enter"||e.key===" ")&&
  e.target.matches('.entry[role="button"]')){
  e.preventDefault();e.target.click();
 }
});
document.addEventListener("input",e=>{
 if(e.target.id==="historySearch"){
  ui.search=e.target.value;
  // 검색 중 포커스를 유지하며 내역 영역만 교체
  const pos=e.target.selectionStart;
  render();
  const input=$("#historySearch");
  if(input){input.focus();input.setSelectionRange(pos,pos)}
 }
});
document.addEventListener("change",e=>{
 if(e.target.id==="txType")changeType(e.target.value);
 if(e.target.id==="themeChoice"){
  db.theme=e.target.value;persist();theme();render();
 }
});

/* ===== 폼 제출 ===== */
document.addEventListener("submit",async e=>{
 e.preventDefault();
 if(isLocked&&e.target.id!=="unlockForm")return;
 const form=e.target,f=new FormData(form);
 try{
 switch(form.id){
 case "quickForm":{
  const text=String(f.get("quick")||"").trim();
  if(!text){toast("입력 문장을 적어 주세요");return}
  ui.queue=[];
  openForm(naturalParse(text),"규칙으로 읽은 내용입니다. 저장 전 확인해 주세요.");
  break;
 }
 case "txForm":saveTx(form);break;
 case "smsForm":{
  const s=String(f.get("sms")||"").trim();
  if(!s){toast("문자 내용을 붙여넣어 주세요");return}
  sheet("문자 읽는 중",`<div class="card center">문자를 분석하고 있어요.</div>`);
  await handleSMS(s);
  break;
 }
 case "budgetForm":{
  mutate(()=>{
   db.budgets.total=Math.max(0,num(f.get("total")));
   categories("expense").forEach((c,i)=>{
    db.budgets.category[c]=Math.max(0,num(f.get("b"+i)));
   });
  });
  render();toast("예산을 저장했어요");break;
 }
 case "aiForm":{
  mutate(()=>{
   db.recognition=f.get("recognition");
   db.geminiKey=String(f.get("geminiKey")||"").trim();
   db.geminiModel=String(f.get("geminiModel")||"").trim();
   db.claudeKey=String(f.get("claudeKey")||"").trim();
   db.claudeModel=String(f.get("claudeModel")||"").trim();
  });
  render();toast("인식 설정을 저장했어요");break;
 }
 case "categoryForm":{
  const type=f.get("type"),cat=String(f.get("cat")||"").trim();
  if(!["expense","income"].includes(type))return;
  if(!cat){toast("카테고리 이름을 입력하세요");return}
  if(categories(type).includes(cat)){toast("이미 있는 카테고리입니다");return}
  mutate(()=>db.cats[type].push(cat));
  categorySheet(type);render();toast("카테고리를 추가했어요");
  break;
 }
 case "recurringForm":{
  const name=String(f.get("name")||"").trim();
  const amount=Number(f.get("amount")),day=Number(f.get("day"));
  const start=f.get("start");
  if(!name||!Number.isSafeInteger(amount)||amount<=0||
    !Number.isInteger(day)||day<1||day>31||
    !/^\d{4}-\d{2}$/.test(start)){
   toast("고정지출 정보를 확인해 주세요");return;
  }
  mutate(()=>db.recurring.push({
   id:id(),name,amount,day,start,
   cat:chooseCat("expense",f.get("cat")),
   payment:PAYMENTS.includes(f.get("payment"))?f.get("payment"):"카드"
  }));
  processRecurring();closeSheet();render();
  toast("고정지출을 등록했어요");
  break;
 }
 case "unlockForm":{
  const h=await sha256(String(f.get("pin")));
  if(h===db.pinHash){unlockScreen();awayAt=0;toast("잠금을 해제했어요")}
  else toast("PIN이 올바르지 않아요");
  break;
 }
 case "pinForm":{
  if(db.pinHash){
   const old=await sha256(String(f.get("old")));
   if(old!==db.pinHash){toast("현재 PIN이 틀렸어요");return}
  }
  if(f.get("remove")==="1"){
   mutate(()=>db.pinHash="");
   closeSheet();render();toast("PIN 잠금을 해제했어요");return;
  }
  const pin=String(f.get("newPin")||"");
  if(!/^\d{4}$/.test(pin)||pin!==f.get("again")){
   toast("4자리 숫자 PIN과 확인 입력이 일치해야 합니다");return;
  }
  const hash=await sha256(pin);
  mutate(()=>db.pinHash=hash);
  closeSheet();render();toast("PIN을 저장했어요");
  break;
 }
 }
 }catch(err){toast(err.message||"저장하는 중 오류가 발생했어요")}
});

});
$("#galleryInput").addEventListener("change",async e=>{

 try{await importFile(file,"json")}catch(err){toast("JSON 오류: "+err.message)}
});

/* ===== 초기 실행 ===== */
setupPWA();
processRecurring();
render();
if(db.pinHash)lockScreen();
</script>
